<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Principal - Portal Académico Estudiantil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/principal.css" />
</head>

<body>
    <portal-header></portal-header>

    <barra-navegacion activo="inicio"></barra-navegacion>

    <main class="contenedor-principal principal-layout">
        <!-- Columna izquierda: espacio temporal para Web Component <accesos-directos> -->
        <section class="columna-accesos" aria-label="Accesos directos">
            <div class="espacio-acceso">[ Acceso: Horario escolar ]</div>
            <div class="espacio-acceso">[ Acceso: Materias ]</div>
            <div class="espacio-acceso">[ Acceso: Calificaciones ]</div>
        </section>

        <!-- Columna centro: Web Component del Calendario -->
        <mi-calendario id="calendario" mes="Noviembre" dias="31" eventos="4,17,25"></mi-calendario>

        <!-- Columna derecha: Panel de Eventos Importantes en HTML clásico -->
        <aside class="contenedor-eventos" aria-label="Eventos Importantes">
            <h2 class="eventos-titulo">Eventos Importantes</h2>
            <div class="lista-eventos" id="lista-eventos"></div>
        </aside>
    </main>

    <script type="module" src="../js/principal.js"></script>
</body>

</html>
