<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Académico Estudiantil</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header class="portal-header">
        <div class="header-identidad">
            <img class="header-escudo" src="./assets/logoFacultad.png" alt="Escudo Facultad de Ingeniería" />
        </div>
        <h1 class="header-titulo">Portal Académico Estudiantil</h1>
    </header>

    <main class="login-layout">

        <div class="login-imagen" role="img" aria-label="Fachada Facultad de Ingeniería UASLP"></div>

        <section class="login-panel">
            <div class="login-caja">
                <h2 class="login-titulo">Iniciar Sesión</h2>

                <form class="login-form" id="form-login" novalidate>

                    <div>
                        Web Component: Campo Usuario
                    </div>


                    <div>
                        Web Component: Campo Contraseña
                    </div>


                    <div>
                        Web Component: Botón Iniciar
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>

</html>
